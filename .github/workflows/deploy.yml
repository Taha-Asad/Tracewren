#
# HOW TO USE:
# 1. Add these secrets to your GitHub repo (Settings → Secrets):
#    - SSH_HOST: Your VPS IP address
#    - SSH_USER: Your SSH username
#    - SSH_PRIVATE_KEY: Your SSH private key
#    - SSH_PORT: Your SSH port (usually 22)
# 2. Push to 'main' branch to trigger deployment
# ─────────────────────────────────────────────────────────────

name: Build and Deploy

permissions:
  contents: read
  packages: write
  security-events: write

# When to run this workflow
on:
  push:
    branches: [ main, master ] # Run on push to main
  pull_request:
    branches: [ main, master ] # Run tests on PRs (but don't deploy)
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Environment variables available to all jobs
env:
  APP_NAME: BugBountyTracker
  REGISTRY: ghcr.io  # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── JOB 1: Test ────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Skip tests (no tests configured)
        run: echo "No tests configured"

  # ── JOB 2: Build Docker Image ──────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test # Only run if tests pass

    # Only build on pushes to main (not PRs)
    if: github.event_name == 'push'

    # Output a single canonical image tag so scan/deploy jobs receive one reference
    outputs:
      image-tag: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds for speed
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 3: Security Scan ───────────────────────────────────────────
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  # ── JOB 4: Deploy ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, scan]

    # Only deploy on push to main (not PRs)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    # This creates a GitHub "Environment" with deployment tracking
    environment:
      name: production
      url: https://your-app.com

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Pull the latest image
            docker pull ${{ needs.build.outputs.image-tag }}
            
            # Stop and remove old container
            docker stop BugBountyTracker || true
            docker rm BugBountyTracker || true
            
            # Start new container
            docker run -d \
              --name BugBountyTracker \
              --restart unless-stopped \
              -p 3000:3000 \
              --memory=512m \
              ${{ needs.build.outputs.image-tag }}
            
            # Wait for health check
            sleep 10
            docker ps | grep BugBountyTracker
            
            echo "Deployment complete!"

      - name: Notify on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Deployed successfully!'
            })
