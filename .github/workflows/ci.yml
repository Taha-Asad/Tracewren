name: Continuous Integration & Branch Protection Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-lint:
    name: Code Hygiene & AST Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Type-Check API (NestJS / TypeScript)
        run: npm --prefix apps/api run build

      - name: Type-Check Web App (Next.js 16)
        run: npm --prefix apps/web run build

  test-api:
    name: API Unit & Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Execute Vitest Suite (124 Automated Tests)
        run: npm --prefix apps/api run test

  database-schema-validation:
    name: Prisma Schema & Migration Verification
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/bbt?schema=bbt_core' }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/bbt?schema=bbt_core' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Validate Prisma Schema Syntax
        working-directory: apps/api
        run: npx prisma validate --schema=prisma/schema.prisma
